name: Publish BeiAPI image

on:
  push:
    branches:
      - beiapi-production
      - feature/responses-websocket-relay
  workflow_dispatch:

concurrency:
  group: beiapi-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write build version
        run: echo "beiapi-${GITHUB_SHA::12}" > VERSION

      # Non-production branches get a slugified branch tag so a feature build
      # can never overwrite the :beiapi-production tag that production pulls.
      - name: Resolve image tag
        id: tag
        run: |
          BRANCH_TAG=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          echo "branch_tag=${BRANCH_TAG:0:100}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ghcr.io/yorick-ryu/new-api:${{ steps.tag.outputs.branch_tag }}
            ghcr.io/yorick-ryu/new-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish digest summary
        run: |
          echo '### BeiAPI NewAPI image' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo 'ghcr.io/yorick-ryu/new-api:sha-${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
